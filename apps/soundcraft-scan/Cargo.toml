[package]
name = "soundcraft-scan"
description = "FreeDAWm's plugin scanner helper: lists the plugins in a few VST3 or CLAP bundles in its own process, so a plugin that crashes or hangs while loading never takes the app down"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "freedawm-scan"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
soundcraft-plugin-scan.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
soundcraft-vst3-host.workspace = true
soundcraft-clap-host.workspace = true
