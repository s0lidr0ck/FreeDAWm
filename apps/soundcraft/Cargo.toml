[package]
name = "soundcraft"
description = "FreeDAWm desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "freedawm"

# The package keeps its internal `soundcraft` name; the program is `freedawm`.
[[bin]]
name = "freedawm"
path = "src/main.rs"

[lints]
workspace = true

[features]
# ASIO audio devices on Windows (see soundcraft-playback's `asio` feature).
asio = ["soundcraft-playback/asio"]

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
soundcraft-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true
# The launch splash's JPEG frames (zune-jpeg is already in the graph through soundcraft-video).
image = { workspace = true, features = ["jpeg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
# Scout asks Claude (the Anthropic Messages API, streamed); native only.
ureq = { version = "2", features = ["tls", "json"] }

[build-dependencies]
# Icon + VERSIONINFO for freedawm.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
