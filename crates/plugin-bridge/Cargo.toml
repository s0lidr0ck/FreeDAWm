[package]
name = "soundcraft-plugin-bridge"
description = "FreeDAWm: hosted plug-ins in their own process (the freedawm-plugin-host helper), audio over shared memory, so a plug-in crash silences that plug-in instead of taking the app down (an isolated unsafe helper crate: the shared-memory mapping)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-dsp.workspace = true
soundcraft-clap-host.workspace = true
soundcraft-vst3-host.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
# The audio exchange's shared memory: one file per instance mapped by both processes.
memmap2 = "0.9"

[[bin]]
name = "freedawm-plugin-host"
path = "src/bin/freedawm-plugin-host.rs"

# The isolated unsafe helper crate (craftrules never-crash): this crate opts out of the workspace
# `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere and allows it solely on the
# shared-memory module (`src/shm.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
