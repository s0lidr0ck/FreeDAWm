[package]
name = "soundcraft-playback"
description = "SoundCraft audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-band.workspace = true
soundcraft-dsp.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
# Hardware MIDI input ports (WinMM on Windows, CoreMIDI, ALSA): see `midi_in`.
midir = "0.11"
# The ASIO driver's own latency figures (only with the `asio` feature).
soundcraft-asio-latency = { workspace = true, optional = true, features = ["asio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# JACK as a second audio system on Linux (PipeWire answers JACK clients through pipewire-jack):
# cpal's streams, and `jack` itself to list the devices and connect the streams' ports to the
# chosen one (see `jack`). libjack is loaded at run time, so a machine without it still runs.
cpal = { workspace = true, features = ["jack", "pipewire"] }
jack = "0.13"
# PipeWire itself, to list every source (devices, virtual devices, app streams) and link the
# chosen ones to the input stream (see `pw`). The same version cpal's PipeWire host uses.
pipewire = "0.10"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# The installed ASIO drivers' names (HKLM\SOFTWARE\ASIO), listed without loading them.
windows-registry = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[features]
# ASIO on Windows (cpal's ASIO host). Off by default: building it downloads Steinberg's ASIO SDK
# (its own licence) and needs LLVM (libclang) for the bindings. `cargo build -p soundcraft --features asio`.
# soundcraft-asio-latency reads the driver's own latencies (ASIOGetLatencies) for `reported_latency`.
asio = ["cpal/asio", "dep:soundcraft-asio-latency"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
