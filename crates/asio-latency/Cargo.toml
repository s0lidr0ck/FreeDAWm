[package]
name = "soundcraft-asio-latency"
description = "SoundCraft ASIO driver latency: ASIOGetLatencies through a tiny C++ shim over the asio-sys SDK library (an isolated unsafe helper crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Off by default (a safe stub that answers "not built in"): building it needs Steinberg's ASIO SDK
# (CPAL_ASIO_DIR) and LLVM, like cpal's ASIO host. soundcraft-playback's `asio` feature turns it on.
asio = ["dep:asio-sys"]

# The one copy of the SDK's `asio.lib` (with the driver state cpal's ASIO host loads): the same
# asio-sys cpal uses (Cargo unifies 0.2.x to one version). The shim links against it.
[target.'cfg(windows)'.dependencies]
asio-sys = { version = "0.2.6", optional = true }

[build-dependencies]
cc = "1"

# The isolated unsafe helper crate (craftrules never-crash): this crate opts out of the workspace
# `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere and allows it solely on the
# FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
