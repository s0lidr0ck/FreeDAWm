# The pull-request gate: `cargo xtask ci` (fmt check, clippy -D warnings, the workspace tests,
# the asset and layering checks and the WebAssembly check) on Linux, plus a build-and-test of the
# workspace on macOS and Windows.
#
# No secrets. Release builds are in release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned so a new stable release's lints can't turn the gate red on an unchanged tree. Raise it
  # deliberately (and fix the new clippy findings) in its own pull request.
  RUST_TOOLCHAIN: "1.97.1"
  # The DSP "silence stays cheap" timing tests compare how long a silent tail takes against the
  # signal. On some hosted runners' CPUs the silence is 4 to 13 times slower (likely denormal
  # arithmetic), so CI skips them; they pass on the desktop machines they were written on. See
  # docs/releasing.md › Checks.
  TIMING_SKIPS: "--skip silence_tail_is_cheap --skip a_minute_of_silence_stays_cheap"

jobs:
  ci:
    name: cargo xtask ci (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        # ALSA (cpal, MIDI), PipeWire (cpal's PipeWire host, All sources), the JACK headers (cpal's JACK host; libjack itself loads at run time), CMake + libclang (whisper.cpp for Transcribe Lyrics), OpenSSL,
        # the X11/Wayland headers the window layer links against, and Mesa's software Vulkan
        # (lavapipe) for the UI snapshot tests, which render with wgpu.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            mesa-vulkan-drivers libvulkan1

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: cargo xtask ci
        run: cargo xtask ci
        env:
          XTASK_TEST_ARGS: ${{ env.TIMING_SKIPS }}

  test:
    # The workspace's own tests on the two other desktop platforms (no clippy/fmt: Linux has those).
    name: cargo test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            exclude: ""
          - name: Windows
            os: windows-latest
            # soundcraft-playback's and soundcraft-ui-egui's test binaries crash (access violation)
            # on the hosted Windows runners (not yet diagnosed; the runners have no audio devices);
            # they pass on a desktop Windows machine and on macOS/Linux CI. Here they are only built.
            exclude: "--exclude soundcraft-playback --exclude soundcraft-ui-egui"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --locked ${{ matrix.exclude }} -- ${{ env.TIMING_SKIPS }}

      - name: Build the tests that don't run here
        if: matrix.exclude != ''
        run: cargo test --locked --no-run -p soundcraft-playback -p soundcraft-ui-egui
