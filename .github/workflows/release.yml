# Release builds on GitHub's free standard runners, unsigned (no Apple Developer ID, no Windows
# code-signing certificate). Windows builds with ASIO and WASAPI: Steinberg's ASIO SDK is fetched
# from steinberg.net (checked against its SHA-256) and used under GPLv3, so the Windows packages are
# GPLv3 as a whole (docs/release-playbook.md › ASIO).
#
#   push a tag `v<version>`   build everything and publish the GitHub Release for that tag
#                             (a pre-release when the version has a `-suffix`). The tag must match
#                             `[workspace.package] version` in Cargo.toml.
#   Actions › Release › Run   build everything and create or update a *draft* release
#                             `v<version>` (nobody sees it until a maintainer publishes it, on the
#                             Releases page or with Actions › Publish Release)
#   pull request touching     build and package everything as a check; no release
#   packaging or this file
#
# The release notes are `docs/releases/v<version>.md` (what's new) and the Downloads section
# `packaging/release-notes.sh` writes. Only GITHUB_TOKEN is used. See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.97.1"
  DIST: ${{ github.workspace }}/dist/release

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read and check the version
        run: |
          version="$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          [ -n "$version" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "FreeDAWm $version" >>"$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux x86_64
    needs: version
    # Ubuntu 24.04, not 22.04: ONNX Runtime's prebuilt static library (ort-sys) needs the
    # libstdc++ of GCC 13+. The binaries need glibc >= the build host's (2.39).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            desktop-file-utils zsync file
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nfpm
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build and package
        run: packaging/linux/package.sh --formats "appimage deb rpm tar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  macos:
    # Apple silicon only: ONNX Runtime (ort-sys) has no prebuilt x86_64-apple-darwin library.
    name: macOS arm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build and package (ad-hoc signed, not notarized)
        # No MACOS_SIGN_IDENTITY: package.sh signs ad-hoc, so the DMG opens after the one-time
        # Gatekeeper approval described in docs/releasing.md.
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "$RUST_TOOLCHAIN"
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: ASIO SDK (GPLv3)
        # Not in the repo: downloaded from Steinberg and checked against the known SHA-256.
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'asiosdk.zip'
          Invoke-WebRequest -Uri 'https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip' -OutFile $zip
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($sha -ne 'd5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca') { throw "ASIO SDK zip has SHA-256 $sha, not the expected one" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'asio')
          $dir = Join-Path $env:RUNNER_TEMP 'asio\ASIOSDK'
          if (-not (Test-Path (Join-Path $dir 'common\asio.h'))) { throw "common\asio.h not found in $dir" }
          if (-not (Select-String -Path (Join-Path $dir 'LICENSE.txt') -Pattern 'General Public License \(GPL\) Version 3' -Quiet)) { throw 'the ASIO SDK licence no longer offers GPLv3' }
          "CPAL_ASIO_DIR=$dir" >> $env:GITHUB_ENV
      - name: Build and package (unsigned, ASIO + WASAPI)
        # No signing secrets: sign.ps1 warns and leaves the files unsigned.
        shell: pwsh
        run: packaging/windows/package.ps1 -Arch x64 -Asio
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/release/*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, linux, macos, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # Not `assets/`: that is a folder of the checkout.
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -o pipefail
          cd release-assets
          ls -l
          sha256sum -- * | tee SHA256SUMS.txt
      - name: Create or update the release
        run: |
          tag="v$VERSION"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          notes="$RUNNER_TEMP/notes.md"
          # What's new (docs/releases/<tag>.md, when written) and the Downloads section.
          bash packaging/release-notes.sh "$tag" "$GITHUB_SHA" >"$notes"
          if gh release view "$tag" --json isDraft --jq .isDraft >"$RUNNER_TEMP/draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/draft")" != true ] ; then
              echo "::error::release $tag is already published; bump the version first"
              exit 1
            fi
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --notes-file "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$tag" release-assets/* --draft --title "FreeDAWm $tag" --notes-file "$notes" --target "$GITHUB_SHA" "${prerelease[@]}"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release edit "$tag" --draft=false
            echo "published release $tag" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "draft release $tag updated (publish it on the Releases page)" >>"$GITHUB_STEP_SUMMARY"
          fi
