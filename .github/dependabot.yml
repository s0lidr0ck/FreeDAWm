version: 2
updates:
  # Rust / Cargo dependencies: minor and patch updates in one grouped PR. Semver-major updates
  # (new APIs, e.g. symphonia 0.5 -> 0.6) are ignored here: they need code changes, so do them by
  # hand in their own PR.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions: minor/patch in one PR, major versions in a separate grouped PR (they can drop
  # runner or Node versions, so review them on their own).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      actions-major:
        patterns:
          - "*"
        update-types: ["major"]
    commit-message:
      prefix: "ci(deps)"
